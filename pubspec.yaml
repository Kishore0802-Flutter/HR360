name: hr360_mobile
description: HR360 employee and manager mobile application.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  timezone: ^0.10.1
  local_auth: ^3.0.2
  camera: ^0.12.1
  share_plus: ^12.0.2
  pdf: ^3.13.1
  path_provider: ^2.1.6
  dio: ^5.11.1
  go_router: ^18.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/Manrope-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  remove_alpha_ios: true
  min_sdk_android: 23
