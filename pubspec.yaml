name: hr360_mobile
description: HR360 employee and manager mobile application.
publish_to: none
version: 1.0.1+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.0
  geolocator: ^14.0.0
  timezone: ^0.10.1
  local_auth: ^3.0.0
  camera: ^0.12.0
  share_plus: ^12.0.2
  pdf: ^3.12.0
  path_provider: ^2.1.5
  dio: ^5.7.0
  go_router: ^17.2.0
  geocoding: ^5.0.0
  permission_handler: 11.3.1
  image_picker: ^1.2.2
  file_picker: ^11.0.3
  google_fonts: ^8.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/Manrope-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 23
